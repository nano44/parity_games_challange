name: verify
on:
  push:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the quote checks in experiments/*/check.sh read pinned commits with git show
          fetch-depth: 0
      - name: Boost
        run: sudo apt-get update -q && sudo apt-get install -y -q libboost-filesystem-dev libboost-iostreams-dev libboost-regex-dev libboost-random-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        # setup-python's site-packages is writable, so pip does not fall back to the user site,
        # which `python3 -I` (used by experiments/*/check.sh) ignores.
        run: |
          python3 -m pip install python-sat==1.9.dev15 numpy==2.5.3
          python3 -I -c "import numpy, pysat; print('isolated imports ok', numpy.__version__)"
      - name: Cache Oink build
        uses: actions/cache@v4
        with:
          path: tools/oink
          key: oink-${{ runner.os }}-${{ hashFiles('scripts/setup_oink.sh') }}
      - name: Build Oink
        run: scripts/setup_oink.sh
      - name: Gate
        run: scripts/verify.sh
  lean-lemmas:
    # L-FORMAL's lane project (D21 / L51). Separate from the gate: no lane push depends on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Lean lemmas (lean/lemmas)
        run: |
          if [ ! -f lean/lemmas/lakefile.toml ] && [ ! -f lean/lemmas/lakefile.lean ]; then echo "no lean/lemmas project on this branch: NOT RUN"; exit 0; fi
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean/lemmas
          lake exe cache get
          lake build
          if grep -rnw --include=*.lean -e sorry -e admit . --exclude-dir=.lake; then echo "sorry/admit found"; exit 1; fi
          if [ -f Axioms.lean ]; then
            lake env lean Axioms.lean | grep -o "\[.*\]" | tr -d '[]' | tr ',' '\n' | sed 's/ //g' | grep -v '^$' | sort -u > /tmp/axioms.txt
            cat /tmp/axioms.txt
            if grep -v -x -e propext -e Classical.choice -e Quot.sound /tmp/axioms.txt; then echo "disallowed axiom"; exit 1; fi
          fi
          echo "LEAN LEMMAS PASS"
